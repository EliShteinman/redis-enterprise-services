name: redis-enterprise-services

x-cluster-node: &cluster-node
  image: ${REDIS_ENTERPRISE_IMAGE}
  cap_add:
    - SYS_RESOURCE

x-cluster-bootstrap: &cluster-bootstrap
  image: ${BOOTSTRAP_IMAGE}
  entrypoint: ["/bin/sh", "/bootstrap/create-cluster.sh"]
  volumes:
    - ./bootstrap:/bootstrap:ro
    - ./license:/license:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: "no"
  environment: &bootstrap-environment
    ADMIN_USERNAME: ${CLUSTER_ADMIN_USERNAME:?set CLUSTER_ADMIN_USERNAME in docker/.env}
    ADMIN_PASSWORD: ${CLUSTER_ADMIN_PASSWORD:?set CLUSTER_ADMIN_PASSWORD in docker/.env}
    RELAY_URL: ${BOOTSTRAP_RELAY_URL:?set BOOTSTRAP_RELAY_URL in docker/.env}
    PERSISTENT_PATH: ${PERSISTENT_PATH:?set PERSISTENT_PATH in docker/.env}
    EPHEMERAL_PATH: ${EPHEMERAL_PATH:?set EPHEMERAL_PATH in docker/.env}
    POLL_INTERVAL_SECONDS: ${BOOTSTRAP_POLL_INTERVAL_SECONDS:?set BOOTSTRAP_POLL_INTERVAL_SECONDS in docker/.env}
    MAX_POLLS: ${BOOTSTRAP_MAX_POLLS:?set BOOTSTRAP_MAX_POLLS in docker/.env}
    REQUEST_TIMEOUT_SECONDS: ${BOOTSTRAP_REQUEST_TIMEOUT_SECONDS:?set BOOTSTRAP_REQUEST_TIMEOUT_SECONDS in docker/.env}
    LICENSE_FILE: ${LICENSE_FILE:?set LICENSE_FILE in docker/.env}

services:
  cluster1-node1:
    <<: *cluster-node
    hostname: ${CLUSTER1_FQDN}
    ports:
      - "${CLUSTER1_UI_HOST_PORT}:8443"
      - "${CLUSTER1_API_HOST_PORT}:${CLUSTER_API_PORT}"
      - "${CLUSTER1_DB_HOST_PORTS}:${CLUSTER_DB_PORTS}"
    networks:
      default:
        ipv4_address: ${CLUSTER1_NODE1_IP}
        aliases:
          - ${CLUSTER1_FQDN}
          - redis-${CLUSTER_AA_DB_PORT}.${CLUSTER1_FQDN}

  cluster1-create:
    <<: *cluster-bootstrap
    depends_on:
      - cluster1-node1
    environment:
      <<: *bootstrap-environment
      NODE_HOST: cluster1-node1
      NODE_API_URL: https://localhost:${CLUSTER1_API_HOST_PORT}
      CLUSTER_NAME: ${CLUSTER1_FQDN}

  cluster1-node2:
    <<: *cluster-node
    hostname: ${CLUSTER1_NODE2_HOSTNAME}
    profiles: [multinode]
    ports:
      - "${CLUSTER1_NODE2_API_HOST_PORT}:${CLUSTER_API_PORT}"
    networks:
      default:
        ipv4_address: ${CLUSTER1_NODE2_IP}

  cluster1-node2-join:
    <<: *cluster-bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/join-cluster.sh"]
    profiles: [multinode]
    depends_on:
      cluster1-create:
        condition: service_completed_successfully
      cluster1-node2:
        condition: service_started
    environment:
      <<: *bootstrap-environment
      NODE_HOST: cluster1-node2
      NODE_API_URL: https://localhost:${CLUSTER1_NODE2_API_HOST_PORT}
      CLUSTER_NODE_HOST: cluster1-node1
      CLUSTER_NODE_IP: ${CLUSTER1_NODE1_IP}

  cluster2-node1:
    <<: *cluster-node
    hostname: ${CLUSTER2_FQDN}
    ports:
      - "${CLUSTER2_UI_HOST_PORT}:8443"
      - "${CLUSTER2_API_HOST_PORT}:${CLUSTER_API_PORT}"
      - "${CLUSTER2_DB_HOST_PORTS}:${CLUSTER_DB_PORTS}"
    networks:
      default:
        ipv4_address: ${CLUSTER2_NODE1_IP}
        aliases:
          - ${CLUSTER2_FQDN}
          - redis-${CLUSTER_AA_DB_PORT}.${CLUSTER2_FQDN}

  cluster2-create:
    <<: *cluster-bootstrap
    depends_on:
      - cluster2-node1
    environment:
      <<: *bootstrap-environment
      NODE_HOST: cluster2-node1
      NODE_API_URL: https://localhost:${CLUSTER2_API_HOST_PORT}
      CLUSTER_NAME: ${CLUSTER2_FQDN}

networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
          ip_range: ${NETWORK_DYNAMIC_IP_RANGE}
