name: redis-enterprise-services

x-cluster-node: &cluster-node
  image: ${REDIS_ENTERPRISE_IMAGE}
  cap_add:
    - SYS_RESOURCE

x-cluster-bootstrap: &cluster-bootstrap
  image: ${BOOTSTRAP_IMAGE}
  entrypoint: ["/bin/sh", "/bootstrap/create-cluster.sh"]
  volumes:
    - ./bootstrap:/bootstrap:ro
    - ./license:/license:ro
  restart: "no"
  environment: &bootstrap-environment
    ADMIN_USERNAME: ${ADMIN_USERNAME}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    API_PORT: ${CLUSTER_API_PORT}
    PERSISTENT_PATH: ${PERSISTENT_PATH}
    EPHEMERAL_PATH: ${EPHEMERAL_PATH}
    POLL_INTERVAL_SECONDS: ${BOOTSTRAP_POLL_INTERVAL_SECONDS}
    LICENSE_FILE: ${LICENSE_FILE}

services:
  cluster1:
    <<: *cluster-node
    hostname: ${CLUSTER1_NAME}
    ports:
      - "${CLUSTER1_UI_PORT}:8443"
      - "${CLUSTER1_API_PORT}:${CLUSTER_API_PORT}"
      - "${CLUSTER1_DB_HOST_PORTS}:${CLUSTER_DB_PORTS}"
    networks:
      default:
        aliases:
          - ${CLUSTER1_NAME}
          - redis-${CLUSTER_AA_DB_PORT}.${CLUSTER1_NAME}

  cluster1-bootstrap:
    <<: *cluster-bootstrap
    depends_on:
      - cluster1
    environment:
      <<: *bootstrap-environment
      CLUSTER_HOST: cluster1
      CLUSTER_NAME: ${CLUSTER1_NAME}

  cluster1-node2:
    <<: *cluster-node
    hostname: ${CLUSTER1_NODE2_NAME}
    profiles: [multinode]

  cluster1-node2-join:
    <<: *cluster-bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/join-cluster.sh"]
    profiles: [multinode]
    depends_on:
      cluster1-bootstrap:
        condition: service_completed_successfully
      cluster1-node2:
        condition: service_started
    environment:
      <<: *bootstrap-environment
      NODE_HOST: cluster1-node2
      CLUSTER_HOST: cluster1

  cluster2:
    <<: *cluster-node
    hostname: ${CLUSTER2_NAME}
    ports:
      - "${CLUSTER2_UI_PORT}:8443"
      - "${CLUSTER2_API_PORT}:${CLUSTER_API_PORT}"
      - "${CLUSTER2_DB_HOST_PORTS}:${CLUSTER_DB_PORTS}"
    networks:
      default:
        aliases:
          - ${CLUSTER2_NAME}
          - redis-${CLUSTER_AA_DB_PORT}.${CLUSTER2_NAME}

  cluster2-bootstrap:
    <<: *cluster-bootstrap
    depends_on:
      - cluster2
    environment:
      <<: *bootstrap-environment
      CLUSTER_HOST: cluster2
      CLUSTER_NAME: ${CLUSTER2_NAME}
