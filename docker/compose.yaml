name: redis-enterprise-services

x-cluster-node: &cluster-node
  image: ${REDIS_ENTERPRISE_IMAGE}
  cap_add:
    - SYS_RESOURCE

x-cluster-bootstrap: &cluster-bootstrap
  image: ${BOOTSTRAP_IMAGE}
  entrypoint: ["/bin/sh", "/bootstrap/create-cluster.sh"]
  volumes:
    - ./bootstrap:/bootstrap:ro
    - ./license:/license:ro
  restart: "no"
  environment: &bootstrap-environment
    ADMIN_USERNAME: ${CLUSTER_ADMIN_USERNAME}
    ADMIN_PASSWORD: ${CLUSTER_ADMIN_PASSWORD}
    API_PORT: ${CLUSTER_API_PORT}
    PERSISTENT_PATH: ${PERSISTENT_PATH}
    EPHEMERAL_PATH: ${EPHEMERAL_PATH}
    POLL_INTERVAL_SECONDS: ${BOOTSTRAP_POLL_INTERVAL_SECONDS}
    LICENSE_FILE: ${LICENSE_FILE}

services:
  cluster1-node1:
    <<: *cluster-node
    hostname: ${CLUSTER1_FQDN}
    ports:
      - "${CLUSTER1_UI_HOST_PORT}:8443"
      - "${CLUSTER1_API_HOST_PORT}:${CLUSTER_API_PORT}"
      - "${CLUSTER1_DB_HOST_PORTS}:${CLUSTER_DB_PORTS}"
    networks:
      default:
        ipv4_address: ${CLUSTER1_NODE1_IP}
        aliases:
          - ${CLUSTER1_FQDN}
          - redis-${CLUSTER_AA_DB_PORT}.${CLUSTER1_FQDN}

  cluster1-create:
    <<: *cluster-bootstrap
    depends_on:
      - cluster1-node1
    environment:
      <<: *bootstrap-environment
      NODE_HOST: cluster1-node1
      CLUSTER_NAME: ${CLUSTER1_FQDN}

  cluster1-node2:
    <<: *cluster-node
    hostname: ${CLUSTER1_NODE2_HOSTNAME}
    profiles: [multinode]
    networks:
      default:
        ipv4_address: ${CLUSTER1_NODE2_IP}

  cluster1-node2-join:
    <<: *cluster-bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/join-cluster.sh"]
    profiles: [multinode]
    depends_on:
      cluster1-create:
        condition: service_completed_successfully
      cluster1-node2:
        condition: service_started
    environment:
      <<: *bootstrap-environment
      NODE_HOST: cluster1-node2
      CLUSTER_NODE_HOST: cluster1-node1
      CLUSTER_NODE_IP: ${CLUSTER1_NODE1_IP}

  cluster2-node1:
    <<: *cluster-node
    hostname: ${CLUSTER2_FQDN}
    ports:
      - "${CLUSTER2_UI_HOST_PORT}:8443"
      - "${CLUSTER2_API_HOST_PORT}:${CLUSTER_API_PORT}"
      - "${CLUSTER2_DB_HOST_PORTS}:${CLUSTER_DB_PORTS}"
    networks:
      default:
        ipv4_address: ${CLUSTER2_NODE1_IP}
        aliases:
          - ${CLUSTER2_FQDN}
          - redis-${CLUSTER_AA_DB_PORT}.${CLUSTER2_FQDN}

  cluster2-create:
    <<: *cluster-bootstrap
    depends_on:
      - cluster2-node1
    environment:
      <<: *bootstrap-environment
      NODE_HOST: cluster2-node1
      CLUSTER_NAME: ${CLUSTER2_FQDN}

networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
          ip_range: ${NETWORK_DYNAMIC_IP_RANGE}
