[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redis-enterprise-services"
version = "0.1.0"
description = "Creates Redis Enterprise databases with their users as one operation that succeeds, rolls back, or stops for manual intervention"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings[yaml]>=2.16.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redis_enterprise_services"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.importlinter]
root_package = "redis_enterprise_services"

[[tool.importlinter.contracts]]
name = "top-level packages and modules import only downward in this order; every one must be listed; those joined by | do not import each other"
type = "layers"
containers = ["redis_enterprise_services"]
exhaustive = true
layers = [
    "app",
    "composition",
    "api",
    "creation",
    "planning",
    "steps | state",
    "users | roles | acls | databases",
    "resources",
    "cluster",
    "edge",
    "cluster_access",
    "recovery",
    "saga | operations",
    "logger | telemetry | timing | background | liveness",
    "config | exceptions",
]

[[tool.importlinter.contracts]]
name = "saga subpackages import only downward: engine, then plan, then contract"
type = "layers"
layers = [
    "redis_enterprise_services.saga.engine",
    "redis_enterprise_services.saga.plan",
    "redis_enterprise_services.saga.contract",
]

[[tool.importlinter.contracts]]
name = "edge, the cluster API and the repositories do not import the saga, not even indirectly"
type = "forbidden"
source_modules = [
    "redis_enterprise_services.edge",
    "redis_enterprise_services.cluster",
    "redis_enterprise_services.resources",
    "redis_enterprise_services.databases",
    "redis_enterprise_services.users",
    "redis_enterprise_services.roles",
    "redis_enterprise_services.acls",
]
forbidden_modules = ["redis_enterprise_services.saga"]

[[tool.importlinter.contracts]]
name = "steps import from the saga only its contract, never the engine or plan"
type = "forbidden"
source_modules = ["redis_enterprise_services.steps"]
forbidden_modules = ["redis_enterprise_services.saga.engine", "redis_enterprise_services.saga.plan"]

[[tool.importlinter.contracts]]
name = "state does not import the saga engine or plan, or edge, the cluster API or the repositories, not even indirectly"
type = "forbidden"
source_modules = ["redis_enterprise_services.state"]
forbidden_modules = [
    "redis_enterprise_services.saga.engine",
    "redis_enterprise_services.saga.plan",
    "redis_enterprise_services.edge",
    "redis_enterprise_services.cluster",
    "redis_enterprise_services.resources",
    "redis_enterprise_services.databases",
    "redis_enterprise_services.users",
    "redis_enterprise_services.roles",
    "redis_enterprise_services.acls",
]

[[tool.importlinter.contracts]]
name = "the listed packages do not import edge directly; of the layers above the cluster API, only app and the composition may"
type = "forbidden"
source_modules = [
    "redis_enterprise_services.resources",
    "redis_enterprise_services.databases",
    "redis_enterprise_services.users",
    "redis_enterprise_services.roles",
    "redis_enterprise_services.acls",
    "redis_enterprise_services.steps",
    "redis_enterprise_services.api",
    "redis_enterprise_services.creation",
    "redis_enterprise_services.planning",
    "redis_enterprise_services.recovery",
    "redis_enterprise_services.liveness",
    "redis_enterprise_services.operations",
]
forbidden_modules = ["redis_enterprise_services.edge"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the listed packages import interfaces only: not the concrete edge client, cluster REST/polling classes, resource repositories, background runner, or the Redis client, lock, writer and stores"
type = "forbidden"
source_modules = [
    "redis_enterprise_services.steps",
    "redis_enterprise_services.users",
    "redis_enterprise_services.roles",
    "redis_enterprise_services.acls",
    "redis_enterprise_services.api",
    "redis_enterprise_services.creation",
    "redis_enterprise_services.planning",
    "redis_enterprise_services.recovery",
    "redis_enterprise_services.liveness",
    "redis_enterprise_services.operations",
]
forbidden_modules = [
    "redis_enterprise_services.edge.client",
    "redis_enterprise_services.cluster.edge_cluster_api_caller",
    "redis_enterprise_services.cluster.polling_action_waiter",
    "redis_enterprise_services.resources.rest_resource_endpoint",
    "redis_enterprise_services.resources.endpoint_resource_repository",
    "redis_enterprise_services.cluster.read_again_polling",
    "redis_enterprise_services.background.thread_pool_task_runner",
    "redis_enterprise_services.databases.rest_database_fields_repository",
    "redis_enterprise_services.databases.polling_database_waiter",
    "redis_enterprise_services.state.redis_client",
    "redis_enterprise_services.state.tracked_record_writer",
    "redis_enterprise_services.state.redis_operation_store",
    "redis_enterprise_services.state.redis_saga_record_store",
    "redis_enterprise_services.state.redis_saga_lock",
    "redis_enterprise_services.state.redis_heartbeat_store",
    "redis_enterprise_services.state.redis_abandoned_store",
]
allow_indirect_imports = true
