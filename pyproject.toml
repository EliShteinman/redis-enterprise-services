[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redis-enterprise-services"
version = "0.1.0"
description = "Creates, edits and deletes Redis Enterprise databases as one operation that fully succeeds or rolls back"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings[yaml]>=2.16.1",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redis_enterprise_services"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE", "S", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
