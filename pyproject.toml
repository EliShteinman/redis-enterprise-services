[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redis-enterprise-services"
version = "0.1.0"
description = "Creates, edits and deletes Redis Enterprise databases as one operation that fully succeeds or rolls back"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings[yaml]>=2.16.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redis_enterprise_services"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE", "S", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.importlinter]
root_package = "redis_enterprise_services"

[[tool.importlinter.contracts]]
name = "every top-level package has a place in the layers (a new package fails until it is added)"
type = "layers"
containers = ["redis_enterprise_services"]
exhaustive = true
layers = [
    "app",
    "api",
    "steps | state",
    "users | roles | acls",
    "resources | databases",
    "cluster",
    "edge",
    "saga",
    "logger | telemetry",
    "config | exceptions",
]

[[tool.importlinter.contracts]]
name = "saga folders: engine over plan over contract"
type = "layers"
layers = [
    "redis_enterprise_services.saga.engine",
    "redis_enterprise_services.saga.plan",
    "redis_enterprise_services.saga.contract",
]

[[tool.importlinter.contracts]]
name = "repositories and transport do not know the saga, the state store or the API"
type = "forbidden"
source_modules = [
    "redis_enterprise_services.edge",
    "redis_enterprise_services.cluster",
    "redis_enterprise_services.resources",
    "redis_enterprise_services.databases",
    "redis_enterprise_services.users",
    "redis_enterprise_services.roles",
    "redis_enterprise_services.acls",
]
forbidden_modules = [
    "redis_enterprise_services.saga",
    "redis_enterprise_services.state",
    "redis_enterprise_services.api",
    "redis_enterprise_services.app",
]

[[tool.importlinter.contracts]]
name = "steps use only the saga contract, and not the state store or the API"
type = "forbidden"
source_modules = ["redis_enterprise_services.steps"]
forbidden_modules = [
    "redis_enterprise_services.saga.engine",
    "redis_enterprise_services.saga.plan",
    "redis_enterprise_services.state",
    "redis_enterprise_services.api",
    "redis_enterprise_services.app",
]

[[tool.importlinter.contracts]]
name = "the state store uses only the saga contract, and nothing of the clusters, steps or API"
type = "forbidden"
source_modules = ["redis_enterprise_services.state"]
forbidden_modules = [
    "redis_enterprise_services.saga.engine",
    "redis_enterprise_services.saga.plan",
    "redis_enterprise_services.edge",
    "redis_enterprise_services.cluster",
    "redis_enterprise_services.resources",
    "redis_enterprise_services.databases",
    "redis_enterprise_services.users",
    "redis_enterprise_services.roles",
    "redis_enterprise_services.acls",
    "redis_enterprise_services.steps",
    "redis_enterprise_services.api",
    "redis_enterprise_services.app",
]
