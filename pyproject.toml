[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redis-enterprise-services"
version = "0.1.0"
description = "Creates, edits and deletes Redis Enterprise databases as one operation that fully succeeds or rolls back"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings[yaml]>=2.11",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redis_enterprise_services"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov"

[tool.coverage.run]
source = ["redis_enterprise_services"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PT", "BLE", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
