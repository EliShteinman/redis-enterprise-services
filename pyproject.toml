[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redis-enterprise-services"
version = "0.1.0"
description = "Creates, edits and deletes Redis Enterprise databases as one operation that fully succeeds or rolls back"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings[yaml]>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redis_enterprise_services"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE", "S", "ANN"]
