database_defaults:
  values:
    version: "8.4"
    replication: true
    data_persistence: aof
    shards_placement: dense
    proxy_policy: all-master-shards
  persistence_values:
    aof:
      aof_policy: appendfsync-every-sec
    snapshot:
      snapshot_policy: [{secs: 3600, writes: 1}]
  overrides:
    - when: {environment: DEV}
      values: {replication: false}
