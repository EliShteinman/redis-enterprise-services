crdb:
  collection_path: /v1/crdbs
  item_path: /v1/crdbs/{uid}
  list_field: crdbs
  cluster_added_item_fields:
    - isSystem
  creation:
    causal_consistency: false
    encryption: false
    compression: 3
  task:
    item_path: /v1/crdb_tasks/{uid}
    id_field: id
    completed_status: finished
    failed_statuses:
      - failed
      - canceled
    result_ttl_seconds: 86400
    guid_field: crdb_guid
    existing_task_error_code: job_exists
    errors_field: errors
    error_cluster_field: cluster_name
    error_code_field: error_code
    wait:
      poll_interval_seconds: 2
      timeout_seconds: 600
