cluster_api:
  fields:
    status: status
    error_code: error_code
    action_uid: action_uid
    roles_permissions: roles_permissions
  fields_query:
    name: fields
    separator: ","
  transient_error_codes:
    - busy
    - db_busy
    - wrong_cluster_state_id

action:
  item_path: /v1/actions/{uid}
  completed_status: completed
  failed_statuses:
    - failed
    - cancelled
    - aborted
  wait:
    poll_interval_seconds: 0.5
    timeout_seconds: 60

database:
  collection_path: /v1/bdbs
  item_path: /v1/bdbs/{uid}
  unreturned_fields: []
  secret_fields:
    - authentication_redis_pass
    - authentication_admin_pass
    - authentication_sasl_pass
  list_fields: []
  active_status: active
  required_fields:
    - uid
    - status
    - endpoints
  endpoints_field: endpoints
  endpoint_fields:
    - dns_name
    - port
    - addr
  creation_failed_status: creation-failed
  order_insensitive_fields:
    - roles_permissions
  fields_defaulting_to_empty_list:
    - roles_permissions
  default_tags: []
  wait:
    poll_interval_seconds: 1
    timeout_seconds: 120

crdb:
  collection_path: /v1/crdbs
  item_path: /v1/crdbs/{uid}
  list_field: crdbs
  cluster_added_item_fields:
    - isSystem
  task:
    item_path: /v1/crdb_tasks/{uid}
    id_field: id
    completed_status: finished
    failed_statuses:
      - failed
      - canceled
    result_ttl_seconds: 86400
    guid_field: crdb_guid
    existing_task_error_code: job_exists
    errors_field: errors
    error_cluster_field: cluster_name
    error_code_field: error_code
    wait:
      poll_interval_seconds: 2
      timeout_seconds: 600

acl:
  collection_path: /v1/redis_acls
  item_path: /v1/redis_acls/{uid}
  unreturned_fields: []
  secret_fields: []
  list_fields: []

role:
  collection_path: /v1/roles
  item_path: /v1/roles/{uid}
  unreturned_fields: []
  secret_fields: []
  list_fields: []
  database_resource_type: db

user:
  collection_path: /v1/users
  item_path: /v1/users/{uid}
  secret_fields: []
  list_fields: []
  unreturned_fields:
    - password
