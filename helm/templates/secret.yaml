{{- $_ := include "res.secretValue" (dict "root" . "name" "RES_STATE__URL") }}
{{- $_ := include "res.secretValue" (dict "root" . "name" "RES_STATE__KEY_PREFIX") }}
{{- if .Values.collector.enabled }}
{{- $_ := include "res.secretValue" (dict "root" . "name" "ELASTIC_PASSWORD") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "res.fullname" . }}
  labels:
    {{- include "res.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
