apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "res.fullname" . }}
  labels:
    {{- include "res.labels" . | nindent 4 }}
spec:
  host: {{ required "route.host is required: the full host name the adapter calls the service at" .Values.route.host }}
  to:
    kind: Service
    name: {{ include "res.fullname" . }}
  port:
    targetPort: http
  tls:
    {{- toYaml .Values.route.tls | nindent 4 }}
