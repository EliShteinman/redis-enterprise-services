apiVersion: v1
kind: Secret
metadata:
  name: {{ include "res.fullname" . }}-clusters
  labels:
    {{- include "res.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "res.clustersFile" . }}: {{ include "res.mappedFile" (dict "root" . "name" (include "res.clustersFile" .)) | b64enc | quote }}
