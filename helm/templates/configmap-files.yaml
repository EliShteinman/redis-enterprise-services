apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "res.fullname" . }}-files
  labels:
    {{- include "res.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/*.yaml" }}
  {{- if ne (base $path) (include "res.clustersFile" $) }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
